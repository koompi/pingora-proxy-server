[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:pingora-proxy]
command=/app/entrypoint.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=5
priority=10
# Add signal handling for SIGHUP to reload certificates
stopsignal=TERM

[program:cert-manager]
command=/app/cert-manager.sh
stdout_logfile=/var/log/cert-manager.log
stderr_logfile=/var/log/cert-manager.log
autorestart=true
startretries=5
priority=20

# Event listener to detect certificate renewal and signal the proxy
[eventlistener:cert-reload]
command=python3 -c "import os, sys, time; fp='/pingora-proxy/cert_renewed'; print('READY'); sys.stdout.flush(); while True: line = sys.stdin.readline(); print('PROCESSING'); sys.stdout.flush(); if os.path.exists(fp): mtime = os.path.getmtime(fp); if time.time() - mtime < 120: print('Reloading certificates'); os.system('supervisorctl signal HUP pingora-proxy'); print('RESULT 2'); print('OK'); sys.stdout.flush();"
events=PROCESS_STATE,TICK_60