# docker-compose.yml with security features removed for testing
version: "3.7"

services:
  proxy:
    image: image.koompi.org/library/pingora-proxy-server:latest
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot:rw
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge:rw
    environment:
      - SWARM_MODE=true
      - SWARM_NETWORKS=ingress
      - LOG_LEVEL=info
      # Removed ENFORCE_NETWORK_ISOLATION
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
    configs:
      - source: proxy-security-policy
        target: /etc/security-policy.json
        mode: 0644  # Changed from 0440 to more permissive
    # Removed all security configurations
    # Removed cap_drop
    # Removed cap_add
    # Removed security_opt
    # Removed read_only
    # Changed tmpfs to regular volumes for better permissions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
      - /tmp:/tmp
      - /var/cache:/var/cache

networks:
  proxy-network:
    external: true
    # Removed encryption for testing