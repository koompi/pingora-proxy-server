version: "3.9"

services:
  proxy:
    image: image.koompi.org/library/pingora-proxy-server:latest
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_BIND_SERVICE
    # Fixed command for Docker Swarm compatibility
    command: "sh -c 'sleep $$(shuf -i 1-10 -n 1) && /app/entrypoint.sh'"
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
      - "9100:9100"
      - "27017:27017" # MongoDB
      - "5432:5432" # PostgreSQL
      - "3306:3306" # MySQL/MariaDB
      # - "6379:6379" # Redis
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot:rw
      - /mnt/gluster/certbot/letsencrypt:/etc/letsencrypt:rw
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge:rw
      - /mnt/gluster/pingora-proxy/locks:/pingora-proxy/locks:rw
      - /mnt/gluster/pingora-proxy/cert_requests:/pingora-proxy/cert_requests:rw
      - /tmp:/tmp
      - /var/cache:/var/cache
      - /mnt/gluster/pingora-proxy/cert-reload:/pingora-proxy/cert-reload:rw
      - /mnt/gluster/cert_limits:/pingora-proxy/cert_limits:rw
      - /mnt/gluster/proxy-config:/app/config:rw
      - /mnt/gluster/pingora-proxy/storage:/pingora-proxy/storage:rw # Add this line for IP rules storage
      # Use tmpfs mount for local locks
      - type: tmpfs
        target: /pingora-proxy/local-locks
        tmpfs:
          size: 5242880 # 5MB
    environment:
      - SWARM_MODE=true
      - SWARM_NETWORKS=proxy-network
      - LOG_LEVEL=info
      - CONFIG_PATH=/app/config/config.json
      - DISABLE_SSL=false
      - PROXY_SERVICE_NAME=proxy_proxy
      - RUST_LOG=info,pingora=debug
      - RUST_BACKTRACE=0
      - RUST_LOG_STYLE=auto
      - RUST_LOG_FILTER=pingora_core::protocols::http::v1::client=info,pingora_proxy::proxy_h1=info
      - METRICS_PORT=9100
      - CONFIG_REFRESH_INTERVAL=30
      - DISTRIBUTED_LOCK_TTL=60
      - HOSTNAME_FOR_LOCKS=${HOSTNAME}
      # Add this to use local lock directory
      - LOCK_DIR=/pingora-proxy/local-locks
      - ENABLE_TCP_PROXY=true
      - TCP_PROXY_TLS=false

    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      endpoint_mode: vip
      placement:
        constraints:
          - node.hostname == selendra-01
        max_replicas_per_node: 1
    configs:
      - source: proxy-security-policy
        target: /etc/security-policy.json
        mode: 0644
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
        tag: "proxy-{{.Name}}"

  # Certificate manager service
  certbot:
    image: image.koompi.org/library/pingora-proxy-server:latest
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot:rw
      - /mnt/gluster/certbot/letsencrypt:/etc/letsencrypt:rw
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge:rw
      - /mnt/gluster/cert_limits:/pingora-proxy/cert_limits:rw
    entrypoint:
      [
        "bash",
        "-c",
        "mkdir -p /certbot/live && bash -c 'while true; do /app/certbot-wrapper.sh renew; sleep 43200; done'",
      ]
    environment:
      - PROXY_SERVICE_NAME=proxy_proxy
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - LOG_LEVEL=info
      - RUST_LOG=info
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "test -d /certbot/letsencrypt || test -d /certbot/live || exit 0",
        ]
      interval: 15s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
        tag: "certbot-{{.Name}}"

  prometheus:
    image: prom/prometheus:latest
    user: "65534:65534"
    volumes:
      - /mnt/gluster/prometheus/config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    networks:
      - proxy-network
    deploy:
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:latest
    user: "472"
    volumes:
      - grafana_data:/var/lib/grafana
      - /mnt/gluster/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3005:3000"
    networks:
      - proxy-network
    depends_on:
      - prometheus
    deploy:
      placement:
        constraints:
          - node.role == manager

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    networks:
      - proxy-network
    environment:
      - REDIS_HOSTS=local:redis:6379
    deploy:
      placement:
        constraints:
          - node.role == manager
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - proxy-network
    deploy:
      placement:
        constraints:
          - node.role == manager

networks:
  proxy-network:
    external: true

configs:
  proxy-security-policy:
    file: ./security-policy.json

volumes:
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gluster/prometheus/data
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gluster/grafana/data
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gluster/redis/data
  cert_reload:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gluster/pingora-proxy/cert-reload
  ip_rules_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gluster/pingora-proxy/storage
