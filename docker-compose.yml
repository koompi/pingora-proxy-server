# docker-compose.yml with simplified configuration
version: "3.9"

services:
  proxy:
    image: image.koompi.org/library/pingora-proxy-server:latest
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 81
        published: 81
        protocol: tcp
        mode: host
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
      - /mnt/gluster/proxy-config:/app/config # Persistent configuration directory
      - /mnt/gluster/pingora-proxy/locks:/pingora-proxy/locks # Shared lock directory
      - /tmp:/tmp
      - /var/cache:/var/cache
    environment:
      - SWARM_MODE=true
      - SWARM_NETWORKS=ingress,proxy-network
      - LOG_LEVEL=info
      - CONFIG_PATH=/app/config/config.json
      - DISABLE_SSL=false
      - PROXY_SERVICE_NAME=proxy_proxy
    deploy:
      mode: global
      update_config:
        order: start-first
      endpoint_mode: dnsrr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: proxy-security-policy
        target: /etc/security-policy.json
        mode: 0644

  # Optional: Dedicated certificate manager service
  certbot:
    image: image.koompi.org/library/pingora-proxy-server:latest
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
    entrypoint:
      [
        "bash",
        "-c",
        "while true; do /app/certbot-wrapper.sh renew; sleep 43200; done",
      ]
    environment:
      - PROXY_SERVICE_NAME=proxy_proxy
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "test", "-f", "/certbot/live"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  proxy-network:
    external: true

configs:
  proxy-security-policy:
    file: ./security-policy.json
