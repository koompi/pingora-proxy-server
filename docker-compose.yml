# docker-compose.yml with simplified load balancing across replicas
version: "3.9"

services:
  proxy:
    image: image.koompi.org/library/pingora-proxy-server:latest
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_BIND_SERVICE
    # Simplified port mapping
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    networks:
      - proxy-network
      - ingress # Explicitly include the ingress network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot:ro
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
      - /mnt/gluster/proxy-config:/app/config
      - /mnt/gluster/pingora-proxy/locks:/pingora-proxy/locks
      - /tmp:/tmp
      - /var/cache:/var/cache
    environment:
      - SWARM_MODE=true
      - SWARM_NETWORKS=ingress,proxy-network
      - LOG_LEVEL=info
      - CONFIG_PATH=/app/config/config.json
      - DISABLE_SSL=false
      - PROXY_SERVICE_NAME=proxy_proxy
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    deploy:
      mode: replicated
      replicas: 3 # Adjust the number of replicas as needed
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      endpoint_mode: vip # This is key - Virtual IP for load balancing
      placement:
        max_replicas_per_node: 1 # At most one replica per node for better distribution
    configs:
      - source: proxy-security-policy
        target: /etc/security-policy.json
        mode: 0644

  # Certificate manager service
  certbot:
    image: image.koompi.org/library/pingora-proxy-server:latest
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
    entrypoint:
      [
        "bash",
        "-c",
        "while true; do /app/certbot-wrapper.sh renew; sleep 43200; done",
      ]
    environment:
      - PROXY_SERVICE_NAME=proxy_proxy
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "test", "-f", "/certbot/live"]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  proxy-network:
    external: true
  ingress:
    external: true

configs:
  proxy-security-policy:
    file: ./security-policy.json
