# docker-compose.yml with Cloudflare credentials for wildcard certificates
version: "3.7"

services:
  proxy:
    image: image.koompi.org/library/pingora-proxy-server:latest
    dns:
      - 127.0.0.11
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    networks:
      - proxy-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gluster/certbot:/certbot
      - /mnt/gluster/acme-challenge:/var/www/html/.well-known/acme-challenge
      - /tmp:/tmp
      - /var/cache:/var/cache
    environment:
      - SWARM_MODE=true
      - SWARM_NETWORKS=ingress
      - LOG_LEVEL=info
      # Let's Encrypt configuration
      - LETS_ENCRYPT_EMAIL=honghangsia@gmail.com
      # Cloudflare credentials for wildcard certificates
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
    configs:
      - source: proxy-security-policy
        target: /etc/security-policy.json
        mode: 0644

networks:
  proxy-network:
    external: true

configs:
  proxy-security-policy:
    file: ./security-policy.json
