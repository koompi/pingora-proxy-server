[package]
name = "pingora-proxy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.87"
bytes = "1.10.1"
clap = "4.5.32"
env_logger = "0.11.7"
futures = "0.3.31"
jemallocator = "0.5.4"
log = "0.4.26"
pingora = { version = "0.4.0", features = ["rustls"] }
pingora-core = { version = "0.4.0", features = ["rustls"] }
pingora-http = "0.4.0"
pingora-load-balancing = "0.4.0"
pingora-proxy = { version = "0.4.0", features = ["rustls"] }
bollard = "0.16.1"
bollard-stubs = "=1.44.0-rc.2"
regex = "1.11.1"
serde = "1.0.219"
serde_json = "1.0.140"
serde_yaml = "0.9.34"
tokio = { version = "1.44.0", features = ["full"] }


# Add rustls dependency directly
rustls = "0.23.23"
rustls-pemfile = "2.0.0"

# Switch to acme-v2 which Proksi uses
acme-v2 = "0.9.3"
once_cell = "1.21.1"
uuid = { version = "1.5", features = ["v4", "serde"] }
openssl = { version = "0.10", features = ["vendored"] }
sha2 = "0.10.8"
chrono = "0.4.40"
sha256 = "1.6.0"
thiserror = "2.0.12"
